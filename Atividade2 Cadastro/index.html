<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade2 Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="Favicon Ftbz.jpg" type="image/x-icon">
</head>
<body>

    <div class="caixa_externa">

        <form action="/enviar" method="post">

            <img class="img_amazon" src="Amazon_.png" alt="amazon">

            <h1>cadastro</h1>

            <br>

            <label for="name">Nome Completo:</label>

            <br>

            <input type="text" id="name" placeholder="Digite seu nome!">

            <br><br>

            <label for="email">E-mail:</label>

            <br>

            <input type="email" id="email" placeholder="Digite seu e-mail!">

            <br><br>

            <label for="password">Senha:</label>

            <br>

            <input type="password" id="password" placeholder="Digite uma senha!">

            <br><br>

        <div class="close_f">

            <div>

                <label for="date_nascimento">Data de Nascimento:</label>

                <br>

                <input type="date" id="date_nascimento">

                <br>

            </div>

            <div>

                <label for="gender">Gênero:</label>

                <br>

                <select name="gender" id="gender">

                    <option value=""disabled>Selecione uma Opção</option>
                    <option value="male">Masculino</option>
                    <option value="female">Feminino</option>
                    <option value="other">Outro</option>
                    <option value="not-say">Prefiro não dizer</option>

                </select>

            </div>

        </div>

                <input class="terms_" type="checkbox" id="terms">

                <label for="terms">Aceito os 
                    
                   <a class="link_terms" href="">termos</a>
                
                </label>

                <br>

                <button class="button_1" type="submit">

                    Cadastrar

                </button>

        </form>

        <hr>

        <p class="log_final">
            
            Já possui conta? 
            
            <a href="">
            
                Login
            
            </a>
        
        </p>

    </div>
    
</body>
</html>
