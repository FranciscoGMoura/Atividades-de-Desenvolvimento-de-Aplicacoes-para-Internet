<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade1 Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="caixa_externa">

        <br>

        <h2>Acessar Plataforma</h2>

        <form action="/enviar" method="post">

            <label for="user">E-mail ou Usuário:</label>

            <br>
            
            <input class="caixa_log" type="text" id="user" placeholder="E-mail ou Usuário!">

            <br><br>

            <label for="password">Senha:</label>

            <br>

            <input class="caixa_log" type="text" id="password" placeholder="Digite sua senha!">

            <br><br><br>

            <button class="botao" type="submit">Entrar</button>

            <br><br><br><br>

            <a href="">Cadastrar-se</a>

        </form>

    </div>

</body>
</html>
